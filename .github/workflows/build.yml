name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: build (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        java: [ '21' ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Validate Maven config
        run: mvn -B validate --no-transfer-progress

      # `install` runs the full lifecycle through `verify`: unit tests + JaCoCo
      # report + the coverage check (jacoco-check, currently non-blocking).
      - name: Build all modules (tests + coverage)
        run: mvn -B clean install --no-transfer-progress

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/'
          retention-days: 7

      - name: Show installed artifacts
        run: |
          echo "===== Artifacts in local repository ====="
          ls -la ~/.m2/repository/com/github/calcifux/ 2>/dev/null || true
          echo ""
          echo "===== Module jars ====="
          find . -name 'remote-upload-*-*.jar' -not -path '*/target/maven-archiver/*' \
                -not -name '*-sources.jar' -not -name '*-javadoc.jar' \
                -exec ls -la {} \; 2>/dev/null
