server.port=8080

# Multipart limits for the demo upload endpoint
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

# Demo S3 / MinIO target (override with your own values)
demo.s3.bucket=my-bucket
demo.s3.endpoint=http://localhost:9000
demo.s3.access-key=my-access-key
demo.s3.secret-key=CHANGE_ME

# remote-upload starter (optional)
remote-upload.checksum-algorithm=SHA-256
